# Tool settings only - Ominvox is installed with setup.ps1 / requirements.txt,
# not as a package.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".cache", ".tools", ".venv*", "dist"]

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, bugbear
select = ["E", "W", "F", "B"]
ignore = [
    "E702",   # a; b on one line - used on purpose for timing lines (t1 = now(); ...)
    "E741",   # short names like `l` in small comprehensions
    "B905",   # zip(strict=...) - lengths are equal by construction
]

[tool.ruff.lint.per-file-ignores]
# Test scripts set up sys.path / env vars before importing the app, and their
# check lines (name, condition, detail) read better on one line.
"tests/*" = ["E401", "E402", "E501"]
