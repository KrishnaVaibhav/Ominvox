name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff==0.17.0
          ruff check --output-format=github .
      - name: JavaScript parses
        run: for f in ominvox/ui/web/*.js; do node --check "$f"; done
      - name: No secrets committed
        run: |
          # A Hugging Face token once slipped into a commit; make sure it can't again.
          if git grep -nE 'hf_[A-Za-z0-9]{30,}' -- . ':!*.md'; then
            echo "::error::A Hugging Face token is committed. Remove it and revoke it on huggingface.co."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|user_settings\.json$'; then
            echo "::error::.env / user_settings.json must not be committed."
            exit 1
          fi

  tests:
    name: Fast tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install
        run: pip install -r requirements-ci.txt
      - name: Run the fast suites (no GPU)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/run_all.py fast
