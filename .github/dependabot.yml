# Dependabot always proposes the latest STABLE release (pre-releases are
# skipped). To keep the number of PRs low, every update of an ecosystem is
# grouped into ONE pull request per month - major versions included - instead
# of one PR per package. Before merging the Python PR, run the GPU test suites
# locally (CI can't run them): tests/run_all.py
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-packages:
        patterns: ["*"]
        update-types: [major, minor, patch]
    ignore:
      # coqui-tts 0.27 breaks on transformers 5 (see requirements.txt).
      - dependency-name: transformers
        versions: [">=5"]
      # PyTorch is pinned in setup.ps1 (2.6 + CUDA 12.4), not in requirements.
      - dependency-name: torch
      - dependency-name: torchaudio
